[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-radar"
version = "0.6.0"
description = "CLI tool to scan CSV, JSON, and Parquet files for Personally Identifiable Information (PII)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nithin", email = "kumbam.nithingoud@gmail.com" }]
keywords = ["pii", "privacy", "data-security", "cli", "csv", "gdpr", "compliance", "azure"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0,<9.0",
    "pandas>=2.0.0,<3.0",
    "rich>=13.0.0,<14.0",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=14.0.0",
]
azure = [
    "azure-storage-blob>=12.0.0",
    "azure-eventhub>=5.10.0",
]
all = [
    "pyarrow>=14.0.0",
    "azure-storage-blob>=12.0.0",
    "azure-eventhub>=5.10.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "pandas-stubs>=2.0.0",
]

[project.scripts]
pii-radar = "pii_radar.cli:main"

[project.urls]
Homepage = "https://github.com/nithin42/pii-radar"
Repository = "https://github.com/nithin42/pii-radar"
Issues = "https://github.com/nithin42/pii-radar/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=pii_radar --cov-report=term-missing --cov-report=xml"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# Updated for Python 3.12 compatibility
